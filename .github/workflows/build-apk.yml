name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init Accounts com.accounts.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: App name and icon (optional step)
        continue-on-error: true
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">الحسابات</string>|' android/app/src/main/res/values/strings.xml
          mkdir -p assets
          cp icon.png assets/icon-only.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#1f3a5f' --iconBackgroundColorDark '#1f3a5f'
      - name: Build APK
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../accounts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: accounts-apk
          path: accounts.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: accounts.apk
