<script>

const I = p => `<svg class="ic" viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const P = {lock:'M5 11h14v10H5zM8 11V7a4 4 0 018 0v4', img:'M3 4h18v16H3zM3 16l5-5 4 4 3-3 6 6M9 9h.01', out:'M9 21H4V3h5M16 17l5-5-5-5M21 12H9', eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6', key:'M15 7a4 4 0 11-3.9 4.9L3 20v-3h3v-3h3l2.1-2.1A4 4 0 0115 7M16 9h.01', shop:'M3 7h18v13H3zM8 7V4h8v3M3 13h18'};
// ===== الصفحات وحقولها: [اسم الحقل, العنوان, النوع, اختياري] =====

const M = {

  payroll:  {t:'الرواتب والحوافز',i:'💵',f:[dt,['emp','الموظف','select:emps'],['ptype','النوع','list:راتب|حافز|سلفة|خصم'],['month','عن شهر','month'],['amount','المبلغ','number'],['pm','طريقة الدفع','list:نقدي|فودافون كاش|انستا باي|تحويل بنكي|شيك'],['note','ملاحظة','text','o']]},
  leaves:   {t:'الإجازات',i:'🏖',f:[['emp','الموظف','select:emps'],['ltype','نوع الإجازة','list:سنوية|مرضية|عارضة|بدون مرتب|أخرى'],['from','من تاريخ','date'],['to','إلى تاريخ','date'],['note','ملاحظة','text','o']]},
  log:      {t:'سجل النشاط',i:'🕵️',f:[['u','المستخدم'],['act','العملية'],['coll','القسم'],['desc','التفاصيل']]},
  expenses: {t:'المصروفات',i:'🧮',f:[dt,['title','البيان'],['cat','النوع','list:إيجار|رواتب|حوافز|كهرباء ومياه|نقل|تسويق|صيانة|مسحوبات شخصية|أخرى'],['amount','المبلغ','number'],['note','ملاحظات','text','o']]},
  income: {t:'الإيرادات الأخرى',i:'💹',f:[dt,['title','البيان'],['cat','النوع','list:بيع خردة|عمولات|إيراد خدمات|إيراد تأجير|إيرادات متنوعة'],['amount','المبلغ','number'],['pm','طريقة القبض','list:نقدي|فودافون كاش|انستا باي|تحويل بنكي|شيك'],['note','ملاحظات','text','o']]}
};
const MENU = [['dash','📊','الصفحة الرئيسية'],['#','الحركة التجارية'],'sales','purchases','sret','pret',['#','المخزون والأطراف'],'products','adj','xfer','customers','suppliers',['#','الموظفين'],'emps','payroll','leaves',['#','المالية'],'cpay','spay','expenses','income',['tre','🏦','الخزنة'],['#','التحليل'],['rep','📈','التقارير'],['set','⚙️','الإعدادات'],'log',['#','تطوير ERP'],['erpQuotes','📝','عروض الأسعار'],['erpReserve','🔒','حجوزات العملاء'],['erpDeliver','🚚','تسليمات البيع'],['erpReceive','📥','استلامات الشراء'],['erpBalances','📦','أرصدة المخازن'],['erpStatus','📊','حالة الفواتير'],['erpLog','🧾','سجل حركات ERP']];
const ST = {sales:-1,purchases:1,sret:1,pret:-1};
const nk = w => (w === true || w === 1 || w === '1' || w === 'w') ? '1' : (!w || w === '0') ? '' : String(w);   // مفتاح المكان: '' محل، '1' مخزن، غير كده مخزن إضافي
const LOCS = () => [{k:'',n:'المحل'},{k:'1',n:'المخزن'}, ...((db.cfg.locs) || []).map(l => ({k:l.id, n:l.name}))];
const locName = w => (LOCS().find(l => l.k == nk(w)) || {n:'مخزن محذوف'}).n;
const locKey = name => (LOCS().find(l => l.n == name) || {k:''}).k;
const wxSum = p => Object.values(p.wx || {}).reduce((a, v) => a + (+v || 0), 0);
const locQty = (p, w) => { const k = nk(w); return k === '' ? Math.round(((+p.stock || 0) - (+p.wstock || 0) - wxSum(p)) * 100) / 100 : k === '1' ? Math.round((+p.wstock || 0) * 100) / 100 : Math.round((+(p.wx || {})[k] || 0) * 100) / 100; };
const locAdd = (p, w, d) => { const k = nk(w); if (k === '') return; if (k === '1') p.wstock = Math.round(((+p.wstock || 0) + d) * 100) / 100; else { p.wx = p.wx || {}; p.wx[k] = Math.round(((+p.wx[k] || 0) + d) * 100) / 100; } };
const xf = r => r.fw !== undefined ? [nk(r.fw), nk(r.tw)] : (r.dir == 'من المحل للمخزن' ? ['', '1'] : ['1', '']);
// ===== تكلفة مستقلة لكل مخزن (p.lc: مفتاح المكان ← متوسط التكلفة؛ المحل = '0') =====
const lcKey = k => { k = nk(k); return k === '' ? '0' : k; };
const lcInit = p => { if (!p.lc) { p.lc = {}; LOCS().forEach(l => { p.lc[lcKey(l.k)] = +p.cost || 0; }); } };
const lcOf = (p, k) => +p.cost || 0;   // 1.9.2: التكلفة = سعر الشراء الأساسي اللي مكتوب في المنتج (من غير متوسط)
const lcIn = () => {};   // 1.9.2: ملغي (كان بيحسب المتوسط)
const lcOut = () => {};
const lcFix = () => {};   // 1.9.2: p.cost مبقاش بيتغير تلقائيًا
const rowCost = (k, p, w, party) => { if (k == 'sret') { const s = db.sales.filter(x => x.party == party && x.product == p.id && x.cost !== undefined).pop(); if (s) return s.cost; } return lcOf(p, w); };
function syncLocForms(){
  const names = LOCS().map(l => l.n).join('|'), a = M.adj.f.find(f => f[0] == 'loc'); if (a) a[2] = 'list:' + names;
  M.xfer.f.forEach(f => { if (f[0] == 'from' || f[0] == 'to') f[2] = 'list:' + names; });
  M.products.f = M.products.f.filter(f => !f[0].startsWith('wx_')); const i = M.products.f.findIndex(f => f[0] == 'wstock');
  (db.cfg.locs || []).slice().reverse().forEach(l => M.products.f.splice(i + 1, 0, ['wx_' + l.id, 'الكمية في ' + l.name, 'number', 'o']));
}
const curW = () => { const e = document.getElementById('f_loc'); return e ? e.value : ''; };
function locCh(){ document.querySelectorAll('#ls select').forEach(sel => [...sel.options].forEach(o => { const p = db.products.find(x => x.id == o.value); if (p) o.textContent = p.name + ' — المتاح ' + locQty(p, curW()); })); }          // تأثير الفاتورة على المخزون
const BM = {customers:['sales','sret','cpay'],suppliers:['purchases','pret','spay']};
const MONEY = ['price','cost','paid','amount','discount'];

// ===== البيانات =====
let db = (() => {
  const parse = t => { try { const o = JSON.parse(t); return o && typeof o == 'object' && !Array.isArray(o) ? o : null; } catch (e) { return null; } };
  let o = null, raw = null;
  try { raw = (window.api && window.api.load()) || null; } catch (e) {}
  try { const n = window.api && window.api.note && window.api.note(); if (n) window.__loadNote = n; } catch (e) {}
  if (raw) { o = parse(raw); if (!o) window.__loadNote = 'ملف البيانات تالف. تم استخدام آخر نسخة سليمة متاحة.'; }
  if (!o) {
    let ls = null; try { ls = localStorage.getItem('acc2'); } catch (e) {}
    if (ls) {
      o = parse(ls);
      if (!o) {
        try { localStorage.setItem('acc2_corrupt_' + Date.now(), ls); } catch (e) {}
        for (const k of ['acc2_bak', 'acc2_pre_sync']) { let t = null; try { t = localStorage.getItem(k); } catch (e) {} if (t && (o = parse(t))) break; }

      }
    }

  return o || {};
})();
Object.keys(M).forEach(k => db[k] = db[k] || []);
['quotes','reservations','deliveries','receipts','erpLog'].forEach(k => db[k] = db[k] || []);
db.cfg = db.cfg || {name:'شركتي', dark:0};
let cur = 'dash', mk = '', editId = null, sp = {}, rk = 'sales', rf = '', rt = '';
const store0 = () => { try { numberInvoices(); track(); } catch (e) {} try { localStorage.setItem('acc2', JSON.stringify(db)); } catch (e) { alert('تعذر حفظ البيانات! المساحة ممتلئة أو التخزين غير متاح. خذ نسخة احتياطية الآن'); } if (window.api) { try { window.api.save(JSON.stringify(db)); } catch (e) {} } clearTimeout(ftm); ftm = setTimeout(() => fsWrite(), 600); try { syncSoon(); } catch (e) {} };
let fh = null, fst = '', ftm = 0;
let _stT = 0; const store = () => { try { db.products.forEach(lcFix); } catch (e) {} clearTimeout(_stT); _stT = setTimeout(() => { _stT = 0; store0(); }, 300); };
const storeNow = () => { if (_stT) { clearTimeout(_stT); _stT = 0; store0(); } };
addEventListener('pagehide', storeNow); addEventListener('beforeunload', storeNow); document.addEventListener('visibilitychange', () => { if (document.hidden) storeNow(); });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n) || 0).toFixed(2);
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const S = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const ld = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => ld(new Date());
const nameOf = (c, id) => (db[c].find(x => x.id == id) || {}).name || '-';
const bal = (k, id) => { const [a, b, c] = BM[k].map(n => db[n].filter(x => x.party == id)); return S(a, x => x.total - x.paid) - S(b, x => x.total - (x.paid || 0)) - S(c, x => x.amount) + (+(db[k].find(x => x.id == id) || {}).open || 0); };
const cash = () => (+db.cfg.cash0 || 0) + S(db.sales, x => x.workflow === 2 ? 0 : x.paid) + S(db.cpay, x => x.amount) + S(db.income, x => x.amount) - S(db.purchases, x => x.workflow === 2 ? 0 : x.paid) - S(db.spay, x => x.amount) - S(db.expenses, x => x.amount) - S(db.sret, x => x.paid || 0) + S(db.pret, x => x.paid || 0);
const profit = f => S(db.sales.filter(f), x => x.total - x.qty * x.cost) - S(db.sret.filter(f), x => x.total - x.qty * x.cost) + S(db.income.filter(f), x => x.amount) - S(db.expenses.filter(x => f(x) && x.cat != 'مسحوبات شخصية'), x => x.amount);

// ===== الصفحة الرئيسية =====
function dash(){
  const t=today(), pm=x=>String(x.date||'').startsWith(t.slice(0,7));
  const net=f=>S(db.sales.filter(f),x=>x.total)-S(db.sret.filter(f),x=>x.total);
  const cards=[['مبيعات اليوم',net(x=>x.date===t),'🛒'],['مبيعات الشهر',net(pm),'📈'],['أرباح الشهر',profit(pm),'💹'],['ديون العملاء',S(db.customers,c=>Math.max(0,bal('customers',c.id))),'👥'],['مستحق للموردين',S(db.suppliers,c=>Math.max(0,bal('suppliers',c.id))),'🏭'],['رصيد الخزينة',cash(),'🏦'],['مصروفات الشهر',S(db.expenses.filter(pm),x=>x.amount),'💸'],['قيمة المخزون',S(db.products,p=>p.stock*p.cost),'📦']];
  const days=[...Array(7)].map((_,i)=>{const d=ld(new Date(Date.now()-(6-i)*864e5));return[d,net(x=>x.date===d)]});

    if (c == 'leaves') return nameOf('emps', r.emp) + ' — ' + r.ltype + ' ' + (r.days || '') + ' يوم';

function alloc(k, ex){
  const pk = k == 'sales' ? 'cpay' : 'spay', G = invs(k).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : invNo(a) - invNo(b)), ext = {}, pool = {};
  G.forEach(g => ext[g.inv] = 0);
  db[pk].forEach(p => { if (p.id == ex) return; if (p.inv && ext[p.inv] !== undefined) ext[p.inv] += p.amount; else pool[p.party] = (pool[p.party] || 0) + p.amount; });
  G.forEach(g => { const over = ext[g.inv] - Math.max(g.total - g.paid, 0); if (over > 0.005) { ext[g.inv] -= over; pool[g.party] = (pool[g.party] || 0) + over; } });
  G.forEach(g => { const need = Math.max(g.total - g.paid - ext[g.inv], 0), a = Math.min(need, pool[g.party] || 0); if (a > 0) { ext[g.inv] += a; pool[g.party] -= a; } });
  return ext;
}

}

<script>
// ===== إصدار 1.9.2: القائمة الرئيسية بالأيقونات (بدل القايمة الجانبية) + صفحة المخازن =====
(function(){
  // صفحة المخازن مدرجة في خريطة التنقل الموحدة للإصدار 2.2.0.

  const PA = {
    home:'M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',
    dash:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
    sales:'M6 6h15l-1.5 9h-12zM6 6L5 2H2M9 20a1 1 0 100-2 1 1 0 000 2M18 20a1 1 0 100-2 1 1 0 000 2',
    purchases:'M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0',
    sret:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',
    pret:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',
    products:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
    wh:'M3 21V9l9-6 9 6v12M3 21h18M8 21v-7h8v7M8 17h8',
    adj:'M8 4H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2M9 2h6v4H9zM9 12h6M9 16h4',
    xfer:'M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4',
    customers:'M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 11a4 4 0 100-8 4 4 0 000 8M21 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8',
    suppliers:'M1 3h15v13H1zM16 8h4l3 3v5h-7zM5.5 21a2.5 2.5 0 100-5 2.5 2.5 0 000 5M18.5 21a2.5 2.5 0 100-5 2.5 2.5 0 000 5',
    reps:'M12 2a5 5 0 100 10 5 5 0 000-10zM4 22v-2a8 8 0 0116 0v2M9 14l3 3 3-3',
    emps:'M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8',
    payroll:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6',
    leaves:'M3 5h18v16H3zM16 3v4M8 3v4M3 11h18',
    cpay:'M12 3v12M7 10l5 5 5-5M5 21h14',
    spay:'M12 21V9M7 14l5-5 5 5M5 3h14',
    expenses:'M3 7a2 2 0 012-2h13v4M3 7v11a2 2 0 002 2h15V9H5a2 2 0 01-2-2M16 14h.01',
    tre:'M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18',
    rep:'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6',
    set:IC.cog,
    log:'M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2',
    sync:IC.refresh, dark:IC.moon, out:'M9 21H4V3h5M16 17l5-5-5-5M21 12H9'
  };
  const sv = (k, s) => '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (PA[k] || PA.box || IC.box) + '"/></svg>';
  const TT = {home:'القائمة الرئيسية', dash:'لوحة المتابعة', wh:'المخازن', tre:'الخزنة', rep:'التقارير', set:'الإعدادات', stmt:'كشف حساب'};
  const ptitle = k => TT[k] || (M[k] && M[k].t) || '';
  const fq = n => String(+(+n || 0).toFixed(2));

  // ---------- القائمة الرئيسية ----------
  function homep(){
    const col = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#0d9488', '#475569'];
    let gi = 0; const secs = [{t: '', c: col[0], it: []}];
    MENU.forEach(m => {
      if (m[0] == '#') { gi++; secs.push({t: m[1], c: col[gi % col.length], it: []}); return; }
      const k = typeof m == 'string' ? m : m[0];
      const t = typeof m == 'string' ? (M[m] || {}).t : m[2];
      if (!canPage(k)) return;
      secs[secs.length - 1].it.push([k, k == 'dash' ? TT.dash : t, "go('" + k + "')"]);
    });
    secs.push({t: 'الحساب', c: '#dc2626', it: [['sync', 'مزامنة الدرايف', 'openSync()'], ['dark', 'الوضع الليلي', 'db.cfg.dark=db.cfg.dark?0:1;store();menu();render()'], ['out', 'تسجيل خروج', 'logout()']]});
    return `<div class="bar"><h1>القائمة الرئيسية</h1><span style="color:var(--m)">${esc(db.cfg.name)}</span></div>` +
      secs.filter(s => s.it.length).map(s => (s.t ? `<h3 class="hs">${esc(s.t)}</h3>` : '') +
        `<div class="tgrid">${s.it.map(x => `<a class="tl" onclick="${x[2]}" style="--a:${s.c}"><i>${sv(x[0], 30)}</i><b>${esc(x[1])}</b></a>`).join('')}</div>`).join('');
  }

  // ---------- صفحة المخازن ----------
  let whK = null, whQ = '', whZ = false, whT = 0;
  function whList(k, q){
    q = (q || '').trim().toLowerCase();
    return db.products.map(p => ({p, q: locQty(p, k)}))
      .filter(x => (whZ || x.q !== 0) && (!q || [x.p.name, x.p.code, x.p.barcode].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => String(a.p.name).localeCompare(String(b.p.name), 'ar'));
  }
  function whRows(k, q){
    const a = whList(k, q), CAP = 300;
    if (!a.length) return '<tr><td colspan="4" class="nil">' + (q ? 'مفيش نتيجة للبحث' : 'مفيش أصناف في المخزن ده') + '</td></tr>';
    return a.slice(0, CAP).map(x => `<tr><td>${esc(x.p.name)}${x.p.code ? ' <small>' + esc(x.p.code) + '</small>' : ''}</td><td><b class="${x.q < 0 ? 'neg' : ''}">${fq(x.q)}</b></td><td>${esc(x.p.unit || '')}</td><td>${money(Math.max(x.q, 0) * lcOf(x.p, k))}</td></tr>`).join('') +
      (a.length > CAP ? `<tr><td colspan="4" class="nil">ظاهر أول ${CAP} من ${a.length} صنف — استخدم البحث</td></tr>` : '');
  }
  function whSum(k){
    let n = 0, q = 0, v = 0;
    db.products.forEach(p => { const x = locQty(p, k); if (x !== 0) n++; if (x > 0) { q += x; v += x * lcOf(p, k); } });
    return {n, q: r2(q), v: r2(v)};
  }
  function whp(){
    const locs = LOCS();
    if (!locs.some(l => l.k === whK)) whK = locs[0].k;
    const L0 = locs.find(l => l.k === whK), s = whSum(whK);
    const chips = locs.map((l, i) => { const t = whSum(l.k); return `<a class="wc${l.k === whK ? ' on' : ''}" onclick="whPick(${i})"><i>${sv('wh', 22)}</i><b>${esc(l.n)}</b><small>${t.n} صنف · قيمة ${money(t.v)}</small></a>`; }).join('');
    return `<div class="bar"><h1>المخازن</h1></div>
    <div class="wcs">${chips}</div>
    <div class="pan"><h3>${esc(L0.n)}</h3>
      <div class="wsum"><div><small>عدد الأصناف</small><b>${s.n}</b></div><div><small>إجمالي الكمية</small><b>${fq(s.q)}</b></div><div><small>القيمة بالتكلفة</small><b>${money(s.v)}</b></div></div>
      <input id="whq" type="search" placeholder="ابحث باسم المنتج أو الكود..." value="${esc(whQ)}" oninput="whFilt()">
      <div class="wact"><button class="btn n" onclick="whTogZ()">${whZ ? 'إخفاء الأصناف اللي كميتها صفر' : 'إظهار الأصناف اللي كميتها صفر'}</button></div>
      <div class="wtw"><table class="wt"><thead><tr><th>المنتج</th><th>الكمية</th><th>الوحدة</th><th>القيمة</th></tr></thead><tbody id="whb">${whRows(whK, whQ)}</tbody></table></div>
      <div class="wact"><button class="btn i" onclick="go('xfer')">تحويل بين المخازن</button><button class="btn n" onclick="go('adj')">جرد المخزون</button></div>
    </div>`;
  }
  window.whPick = i => { const l = LOCS()[i]; if (!l) return; whK = l.k; whQ = ''; render(); };
  window.whTogZ = () => { whZ = !whZ; render(); };
  window.whFilt = () => { clearTimeout(whT); whT = setTimeout(() => { const q = $('whq'), b = $('whb'); if (!q || !b) return; whQ = q.value; b.innerHTML = whRows(whK, whQ); }, 120); };

  // ---------- ربط الصفحات الجديدة بالتنقل والصلاحيات ----------
  const cp = canPage;
  canPage = function(k){ if (k == 'home') return true; if (k == 'wh') return cp('products'); return cp(k); };

  document.body.insertAdjacentHTML('afterbegin', '<div id="nb" class="noprint"><button id="nbh" class="nbb" onclick="go(\'home\')" aria-label="القائمة الرئيسية">' + sv('home', 22) + '<span>القائمة</span></button><b id="nbt"></b><span class="nbr"><button class="nbb" onclick="openSync()" aria-label="مزامنة الدرايف">' + sv('sync', 20) + '</button></span></div>');
  function setBar(){
    const t = $('nbt'); if (t) t.textContent = cur == 'home' ? (db.cfg.name || '') : ptitle(cur);
    const h = $('nbh'); if (h) h.classList.toggle('on', cur == 'home');
  }
  { const m = menu; menu = function(){ m(); setBar(); }; }
  { const r = render; render = function(){
      if (cur == 'home' || cur == 'wh') {
        if (!canPage(cur)) cur = 'home';
        $('main').innerHTML = cur == 'home' ? homep() : whp();
        const f = $('fab'); if (f) f.style.display = 'none';
        try { navLock(); } catch (e) {}
        try { lockUi(); } catch (e) {}
        setBar(); return;
      }
      r(); setBar();
  }; }
  { const d = dash; dash = function(){ return d().replace('الصفحة الرئيسية', 'لوحة المتابعة'); }; }
  // التطبيق يفتح على القائمة الرئيسية بعد الدخول
  { const s = startApp; startApp = function(){ cur = 'home'; s(); }; }
})();
</script>

<script>
// ===== ERP workflow v2: quotes, reservations, physical movements and audit trail =====
['quotes','reservations','deliveries','receipts','erpLog'].forEach(k=>db[k]=db[k]||[]);
const erpId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const erpLog=(kind,ref,details,warehouse='')=>{db.erpLog.push({id:erpId(),date:today(),at:new Date().toISOString(),kind,ref,details,warehouse,user:(typeof ME==='function'?(ME().u||'المستخدم الحالي'):'المستخدم الحالي')});};
const erpInvRows=(k)=>invs(k).filter(x=>x.rows&&x.rows.some(r=>r.workflow===2));
const erpInvLabel=(k,x)=>`#${x.inv} — ${nameOf(k==='sales'?'customers':'suppliers',x.party)} — ${x.date} — ${money(x.total)} ج`;
const erpActiveReserved=(invoice,product)=>{const a=S(db.reservations.filter(x=>x.invoice==invoice&&x.product==product),x=>x.qty);const d=S(db.deliveries.filter(x=>x.invoice==invoice&&x.product==product),x=>x.qty);const rel=S(db.reservations.filter(x=>x.invoice==invoice&&x.product==product),x=>x.released||0);return Math.max(0,a-d-rel)};
const erpReservedAt=(product,warehouse,exceptInvoice='')=>S(db.reservations.filter(x=>x.product==product&&String(nk(x.warehouse))===String(nk(warehouse))&&x.invoice!=exceptInvoice),x=>Math.max(0,(+x.qty||0)-(+x.used||0)-(+x.released||0)));
const erpAvailable=(p,w,except='')=>Math.max(0,locQty(p,w)-erpReservedAt(p.id,w,except));
const erpSelect=(id,items,placeholder)=>`<select id="${id}"><option value="">${placeholder}</option>${items.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select>`;
function erpPage(key){
 if(key==='erpQuotes')return erpQuotesPage();
 if(key==='erpReserve')return erpReservePage();
 if(key==='erpDeliver')return erpMovePage('delivery');
 if(key==='erpReceive')return erpMovePage('receipt');
 if(key==='erpLog')return erpLogPage();
 if(key==='erpBalances')return erpBalancesPage();
 if(key==='erpStatus')return erpStatusPage();
 return '';
}
function erpQuotesPage(){const rows=[...db.quotes].reverse();return `<div class="bar"><h1>📝 عروض الأسعار</h1><button class="btn p" onclick="erpAddQuote()">➕ عرض سعر</button></div><div class="cl">${rows.map(q=>`<div class="cd"><b>${esc(nameOf('customers',q.party))} — ${esc(nameOf('products',q.product))}</b><div class="sub">${q.date} · الكمية ${q.qty} · السعر ${money(q.price)} · الإجمالي ${money(q.total)}</div><div class="ft"><span class="bd ${q.status==='converted'?'g':'y'}">${q.status==='converted'?'تم التحويل':'عرض سعر'}</span>${q.status!=='converted'?`<button class="btn sm p" onclick="erpConvertQuote('${q.id}')">تحويل لفاتورة بيع</button><button class="btn sm d" onclick="erpCancelQuote('${q.id}')">إلغاء</button>`:''}</div></div>`).join('')||emp('لا توجد عروض أسعار')}</div>`}
function erpAddQuote(){if(!erpWriteAllowed('sales'))return;const party=prompt('رقم العميل من قائمة العملاء:\n'+db.customers.map(x=>x.id+' — '+x.name).join('\n'));if(!party)return;if(!db.customers.some(x=>x.id==party)){alert('العميل غير موجود');return}const product=prompt('كود/رقم الصنف:\n'+db.products.map(x=>x.id+' — '+x.name).join('\n'));if(!product)return;const p=db.products.find(x=>x.id==product);if(!p){alert('الصنف غير موجود');return}const qty=+prompt('الكمية');if(!(qty>0))return;const price=+(prompt('سعر الوحدة',p.price)||0);if(!(price>=0))return;const q={id:erpId(),date:today(),party,product,qty,price,total:r2(qty*price),status:'open'};db.quotes.push(q);erpLog('عرض سعر',q.id,`إنشاء عرض سعر للصنف ${p.name} بكمية ${qty}`);store();render()}
function erpConvertQuote(id){if(!erpWriteAllowed('sales'))return;const q=db.quotes.find(x=>x.id==id);if(!q||q.status!=='open')return;const inv=erpId();db.sales.push({id:inv,inv,date:today(),party:q.party,product:q.product,qty:q.qty,price:q.price,total:q.total,discount:0,cost:(db.products.find(p=>p.id==q.product)||{}).cost||0,paid:0,workflow:2,invoiceStatus:'confirmed',quoteId:q.id});q.status='converted';q.invoice=inv;erpLog('تحويل عرض سعر',inv,`تحويل العرض ${id} إلى فاتورة بيع`);store();render();alert('تم تحويل عرض السعر إلى فاتورة مؤكدة. لم يتحرك المخزون أو الخزينة.')}
function erpCancelQuote(id){if(!erpWriteAllowed('sales'))return;const q=db.quotes.find(x=>x.id==id);if(!q||!confirm('إلغاء عرض السعر؟'))return;q.status='cancelled';erpLog('إلغاء عرض سعر',id,'إلغاء عرض السعر');store();render()}
function erpInvoiceOptions(kind){return erpInvRows(kind).map(x=>({value:x.inv,label:erpInvLabel(kind,x)}))}

// ERP 2.1 — Unified invoice workspace: all invoice operations inside invoice + combined filters.
const erpUiState = { type:'all', financial:'all', stock:'all', search:'' };
let erpCurrentInvoice = null;

function erpMoneyFor(kind, inv){
  const g = invs(kind).find(x=>String(x.inv)===String(inv));
  if(!g) return 0;
  const extra = (typeof AL==='function' ? (AL(kind)[inv]||0) : 0);
  return Math.max(0,(g.paid||0)+extra);
}
function erpStockFor(kind, g){
  const isSale = kind==='sales';
  const arr = isSale ? db.deliveries : db.receipts;
  const moved = S(arr.filter(x=>String(x.invoice)===String(g.inv)),x=>+x.qty||0);
  const ordered = S(g.rows,x=>+x.qty||0);
  const movedState = g.rows.some(x=>x.workflow===2) ? (moved<=0.0001?'pending':moved+0.0001>=ordered?'complete':'partial') : 'legacy';
  const reserved = isSale ? S([...new Set(g.rows.map(x=>x.product))],pid=>erpActiveReserved(g.inv,pid)) : 0;
  return {moved,ordered,left:Math.max(0,ordered-moved),state:movedState,reserved};
}
function erpAdvanceFor(kind, party){
  const pk=kind==='sales'?'cpay':'spay';
  // Include both unlinked advances and any excess from payments linked to an invoice.
  const totalPayments=S(db[pk].filter(x=>x.party==party),x=>+x.amount||0);
  const invoices=invs(kind).filter(x=>x.party==party);
  const assigned=S(invoices,x=>Math.max(0,AL(kind)[x.inv]||0));
  return Math.max(0,totalPayments-assigned);
}
function erpFinancialState(kind,g){
  const paid=erpMoneyFor(kind,g.inv), remain=Math.max(0,g.total-paid);
  return {paid,remain,state:remain<=0.005?'paid':paid>0.005?'partial':'due',advance:erpAdvanceFor(kind,g.party)};
}
function erpUnifiedRows(){
  const out=[];
  ['sales','purchases'].forEach(kind=>invs(kind).forEach(g=>out.push({kind,g,quote:null})));
  (db.quotes||[]).forEach(q=>out.push({kind:'quote',g:null,quote:q}));
  return out.sort((a,b)=>String((a.g||a.quote).date||'').localeCompare(String((b.g||b.quote).date||'')) || String((a.g||a.quote).inv||(a.g||a.quote).id).localeCompare(String((b.g||b.quote).inv||(b.g||b.quote).id))).reverse();
}
function erpUnifiedMatches(row){
  const f=erpUiState, item=row.g||row.quote, kind=row.kind;
  if(f.type!=='all' && f.type!==kind) return false;
  if(f.search){const hay=[item.inv||item.id,item.date,nameOf(kind==='sales'?'customers':kind==='purchases'?'suppliers':'customers',item.party),...(row.g?row.g.rows.map(r=>nameOf('products',r.product)): [nameOf('products',item.product)])].join(' ').toLowerCase();if(!hay.includes(f.search.toLowerCase()))return false;}
  if(kind==='quote') return f.financial==='all' && f.stock==='all';
  const fin=erpFinancialState(kind,row.g), st=erpStockFor(kind,row.g);
  if(f.financial==='paid'&&fin.state!=='paid')return false;
  if(f.financial==='due'&&fin.state!=='due')return false;
  if(f.financial==='partial'&&fin.state!=='partial')return false;
  if(f.financial==='advance'&&fin.advance<=0.005)return false;
  if(f.stock==='pending'&&!(st.state==='pending'||st.state==='legacy'&&false))return false;
  if(f.stock==='partial'&&st.state!=='partial')return false;
  if(f.stock==='complete'&&st.state!=='complete'&&st.state!=='legacy')return false;
  if(f.stock==='reserved'&&st.reserved<=0.005)return false;
  return true;
}

try{if(cur==='erpQuotes'||cur==='erpReserve'||cur==='erpDeliver'||cur==='erpReceive'||cur==='erpBalances'||cur==='erpStatus'||cur==='erpLog')cur='erpInvoices';menu();render()}catch(e){console.error('ERP 2.1 UI',e)}

</script>

<script>
// ERP 2.1.1: choose document type and record already-completed money/goods at creation.
(function(){
  const _openM211 = openM;
  openM = function(k,id,pre={}){
    _openM211(k,id,pre);
    if(!['sales','purchases'].includes(k) || pre.edit || !$('modal') || $('modal').style.display==='none') return;
    const sale=k==='sales';
    const block=`<section class="pan erp-create-options" style="margin-top:12px;padding:12px;border:1px solid var(--b,#ddd)">
      <h3 style="margin:0 0 8px">إعدادات الفاتورة قبل الحفظ</h3>
      <label>نوع الفاتورة</label><select id="f_documentType" onchange="erpToggleCreateType211()">${sale?'<option value="invoice">فاتورة بيع عادية</option><option value="quote">عرض سعر</option>':'<option value="invoice">فاتورة شراء عادية</option>'}</select>
      <div class="erp-invoice-actions" id="erpInvoiceActions211">
        <div class="erp-money-inline"><div><label>${sale?'المبلغ المقبوض الآن':'المبلغ المدفوع الآن'}</label><input id="f_createMoney211" type="number" min="0" step="0.01" value="0" placeholder="0 = آجل بالكامل"></div><div><label>طريقة ${sale?'القبض':'الدفع'}</label><select id="f_createMethod211"><option>نقدي</option><option>فودافون كاش</option><option>انستا باي</option><option>تحويل بنكي</option><option>شيك</option></select></div></div>
        <label class="erp-goods-toggle"><input type="checkbox" id="f_recordGoodsNow"> <span>${sale?'تم تسليم كل البضاعة الآن':'تم استلام كل البضاعة الآن'}</span></label>
        <small style="display:block;color:var(--m);margin-top:5px">المبلغ يُسجّل في حساب الطرف والخزينة عند الحفظ. وحركة البضاعة لا تتم إلا عند تحديد الخيار.</small>
      </div>
    </section>`;
    const total=$('mf').querySelector('#tt');
    if(total) total.closest('h3').insertAdjacentHTML('beforebegin',block); else $('mf').insertAdjacentHTML('beforeend',block);
  };
  window.erpToggleCreateMoney211=function(){};
  window.erpToggleCreateType211=function(){const q=$('f_documentType')?.value==='quote',a=$('erpInvoiceActions211');if(a)a.style.display=q?'none':''};

  const _save211=save;
  save=function(){
    const k=mk, isNew=['sales','purchases'].includes(k)&&!editCtx;
    if(!isNew){_save211();return;}
    const docType=$('f_documentType')?.value||'invoice';
    const party=$('f_party')?.value,date=$('f_date')?.value;
    const rows=[...document.querySelectorAll('#ls .ln')].map(l=>({product:l.querySelector('select')?.value,qty:+l.querySelector('.q')?.value||0,price:+l.querySelector('.pr')?.value||0,warehouse:nk((l.querySelector('.lc')||$('f_loc')||{value:''}).value)}));
    if(docType==='quote'&&k==='sales'){
      if(!party||!date||!rows.length||rows.some(x=>!x.product||!(x.qty>0)||x.price<0)){alert('أكمل بيانات عرض السعر والأصناف');return;}
      const subtotal=rows.reduce((a,x)=>a+x.qty*x.price,0),discount=Math.max(0,+($('f_discount')?.value||0));
      if(discount>subtotal){alert('الخصم أكبر من إجمالي العرض');return;}
      let left=discount;const items=rows.map((x,i)=>{const raw=x.qty*x.price,d=i===rows.length-1?left:(subtotal?Math.round(discount*raw/subtotal*100)/100:0);left=Math.round((left-d)*100)/100;return {...x,total:Math.round((raw-d)*100)/100}});
      const id=erpId(),total=items.reduce((a,x)=>a+x.total,0),q={id,date,party,product:items[0].product,qty:items.reduce((a,x)=>a+x.qty,0),price:items[0].price,total,status:'open',items,itemsText:items.map(x=>nameOf('products',x.product)+' × '+x.qty).join('، ')};
      db.quotes.push(q);erpLog('إنشاء عرض سعر',id,'عرض سعر متعدد الأصناف بإجمالي '+money(total));store();closeM();render();alert('تم حفظ عرض السعر دون التأثير على المخزون أو حساب العميل أو الخزينة.');return;
    }
    const moneyNow=+$('f_createMoney211')?.value||0, takeMoney=moneyNow>0, moneyMethod=$('f_createMethod211')?.value||'نقدي', moveGoods=!!$('f_recordGoodsNow')?.checked;
    if(moneyNow<0){alert('المبلغ لا يمكن أن يكون بالسالب');return;}
    const invoiceGross=Math.max(0,rows.reduce((a,x)=>a+x.qty*x.price,0)-Math.max(0,+($('f_discount')?.value||0))+(($('f_shipon')?.checked)?Math.max(0,+($('f_ship')?.value||0)):0));
    if(takeMoney && moneyNow>invoiceGross+0.005 && !confirm('المبلغ أكبر من صافي الفاتورة. سيتم تسجيل الزيادة كرَصيد مقدم للطرف. هل تريد المتابعة؟'))return;
    if(moveGoods&&k==='sales'){
      const requested={};rows.forEach(x=>{const key=x.product+'|'+nk(x.warehouse);requested[key]=(requested[key]||0)+x.qty});
      for(const key of Object.keys(requested)){const [pid,w]=key.split('|'),p=db.products.find(p=>p.id==pid),available=p?locQty(p,w)-erpReservedAt(pid,w,''):-1;if(!p||requested[key]>available+1e-9){alert('لا يمكن إتمام التسليم الآن؛ الكمية المتاحة غير كافية للصنف '+nameOf('products',pid)+' في '+locName(w));return;}}
    }
    const before=new Set(db[k].map(x=>String(x.inv||x.id)));
    _save211();
    if($('modal')?.style.display!=='none')return;
    const created=db[k].filter(x=>!before.has(String(x.inv||x.id)));
    if(!created.length)return;
    const inv=created[0].inv||created[0].id,group=invs(k).find(g=>String(g.inv)===String(inv));if(!group)return;
    const sale=k==='sales',pk=sale?'cpay':'spay',who=(typeof ME==='function'?(ME().u||'المستخدم الحالي'):'المستخدم الحالي');
    if(takeMoney){db[pk].push({id:erpId(),date,party,amount:moneyNow,pm:moneyMethod,note:'حركة مالية عند إنشاء الفاتورة #'+inv,inv,user:who});_al={};erpLog(sale?'استلام مبلغ عند إنشاء الفاتورة':'دفع مبلغ عند إنشاء الفاتورة',inv,money(moneyNow)+' جنيه');}
    if(moveGoods){const arr=sale?db.deliveries:db.receipts;for(const r of group.rows){const p=db.products.find(p=>p.id==r.product),w=nk(r.w);if(!p)continue;if(sale){p.stock=r2(p.stock-r.qty);locAdd(p,w,-r.qty)}else{p.stock=r2(p.stock+r.qty);locAdd(p,w,r.qty)}arr.push({id:erpId(),date,invoice:inv,product:r.product,warehouse:w,qty:r.qty,user:who,at:new Date().toISOString()});erpLog(sale?'تسليم بضاعة عند إنشاء الفاتورة':'استلام بضاعة عند إنشاء الفاتورة',inv,nameOf('products',r.product)+' × '+r.qty,w);}}
    if(takeMoney||moveGoods){store();render();}
  };

  // Convert multi-line quotations to a single normal sales invoice.
  erpConvertQuote=function(id){
    if(!erpWriteAllowed('sales'))return;const q=db.quotes.find(x=>x.id==id);if(!q||q.status!=='open')return;
    const inv=erpId(),items=Array.isArray(q.items)&&q.items.length?q.items:[{product:q.product,qty:q.qty,price:q.price,total:q.total}];
    const no=nextNo('sales');items.forEach((it,i)=>{const p=db.products.find(p=>p.id==it.product);db.sales.push({id:inv+'-'+i,inv,date:today(),party:q.party,product:it.product,qty:it.qty,price:it.price,total:it.total,discount:0,cost:(p||{}).cost||0,paid:0,workflow:2,invoiceStatus:'confirmed',quoteId:q.id,no});});
    q.status='converted';q.invoice=inv;erpLog('تحويل عرض سعر',inv,`تحويل العرض ${id} إلى فاتورة بيع`);store();render();alert('تم تحويل عرض السعر إلى فاتورة بيع مؤكدة. لم يتحرك المخزون أو الخزينة.');
  };

  // Final menu is built once by ERP 2.2.0 below.
  // Quote cards show every line when the quote was created from the invoice editor.
  try{menu();render();}catch(e){console.error('ERP 2.1.1 patch',e)}
})();
</script>


<script>
// ERP 2.2.0 — one clean navigation map; keep all existing data and workflows.
(function(){
  const cleanMenu = [
    ['dash','📊','لوحة المتابعة'],
    ['#','المبيعات'], 'sales', 'sret', 'reps', ['erpQuotes','📝','عروض الأسعار'],
    ['#','المشتريات'], 'purchases', 'pret',
    ['#','المخزون'], 'products', ['wh','🏬','المخازن'], 'adj', 'xfer',
    ['#','الحسابات والخزينة'], 'customers', 'suppliers', 'cpay', 'spay', ['tre','🏦','الخزنة'], 'expenses', 'income',
    ['#','الموظفون'], 'emps', 'payroll', 'leaves',
    ['#','المتابعة والإدارة'], ['erpInvoices','🧾','كل الفواتير والمتابعة'], ['rep','📈','التقارير'], 'log', ['set','⚙️','الإعدادات']
  ];
  MENU.splice(0, MENU.length, ...cleanMenu);

  let erpMenuActive = 'dash';
  const priorMenu = menu;
  menu = function(){
    priorMenu();
    const links = document.querySelectorAll('#menu a');
    links.forEach(a=>a.classList.remove('on'));
    const active = [...links].find(a=>a.getAttribute('onclick') === `go('${erpMenuActive}')`);
    if(active) active.classList.add('on');
  };

  const priorGo = go;
  go = function(k){
    if(k==='sales' || k==='purchases' || k==='erpQuotes' || k==='erpInvoices'){
      const returningFromInvoice = cur==='erpInvoice' && k==='erpInvoices';
      if(k==='sales' || k==='purchases'){
        erpUiState.type = k;
        erpUiState.financial = 'all';
        erpUiState.stock = 'all';
        erpUiState.search = '';
        erpMenuActive = k;
      } else if(k==='erpQuotes'){
        erpUiState.type = 'quote';
        erpUiState.financial = 'all';
        erpUiState.stock = 'all';
        erpUiState.search = '';
        erpMenuActive = 'erpQuotes';
      } else if(!returningFromInvoice){
        erpUiState.type = 'all';
        erpUiState.financial = 'all';
        erpUiState.stock = 'all';
        erpUiState.search = '';
        erpMenuActive = 'erpInvoices';
      }
      cur='erpInvoices';
      menu(); render();
      if(typeof scrollTo==='function') scrollTo(0,0);
      return;
    }
    erpMenuActive = k;
    priorGo(k);
  };

  const priorOpenInvoice = erpOpenInvoice;
  erpOpenInvoice = function(kind,inv){
    if(erpMenuActive!=='sales' && erpMenuActive!=='purchases') erpMenuActive = kind;
    priorOpenInvoice(kind,inv);
  };

  window.erpOpenQuoteCreate = function(){
    go('sales');
    openM('sales');
    const type=$('f_documentType');
    if(type){type.value='quote'; if(typeof erpToggleCreateType211==='function') erpToggleCreateType211();}
  };
  window.erpSetInvoiceType = function(value){
    if(!['all','sales','purchases','quote'].includes(value)) return;
    erpUiState.type=value;
    erpMenuActive=value==='sales'?'sales':value==='purchases'?'purchases':value==='quote'?'erpQuotes':'erpInvoices';
    menu(); render();
  };
  menu(); render();
})();
</script>
<script>
// ===== 2.3.0-dev: تدقيق الفواتير + تثبيت سياسة التكلفة التاريخية =====
// تكلفة البيع هي p.cost وقت إنشاء سطر الفاتورة، وتظل محفوظة عند تعديل بيانات الصنف لاحقًا.
// لا يوجد متوسط تكلفة تلقائي ولا إعادة تسعير للفواتير التاريخية.
(function(){
  const _saveInv230 = saveInv;
  saveInv = function(){
    const k = mk;
    if (!ST[k]) return _saveInv230();
    const wasEditing = !!(editCtx && editCtx.k === k);
    const oldId = wasEditing ? editCtx.inv : null;
    const before = wasEditing ? db[k].filter(r => (r.inv || r.id) == oldId).map(r => ({product:r.product,qty:r.qty,price:r.price,total:r.total,cost:r.cost,discount:r.discount})) : null;
    const oldLen = db[k].length;
    _saveInv230();
    let rows = [];
    if (wasEditing) rows = db[k].filter(r => (r.inv || r.id) == oldId);
    else if (db[k].length > oldLen) { const id = db[k][db[k].length-1].inv || db[k][db[k].length-1].id; rows = db[k].filter(r => (r.inv || r.id) == id); }
    if (!rows.length) return;
    const id = rows[0].inv || rows[0].id;
    const total = rows.reduce((a,r)=>a+(+r.total||0),0);
    const cost = rows.reduce((a,r)=>a+(+r.qty||0)*(+r.cost||0),0);
    const partyName = nameOf(k==='sales'?'customers':'suppliers', rows[0].party);
    const items = rows.map(r=>nameOf('products',r.product)+' × '+r.qty).join('، ');
    const beforeText = before ? 'قبل: '+before.map(r=>nameOf('products',r.product)+' × '+r.qty+' / تكلفة '+money((+r.qty||0)*(+r.cost||0))).join('، ') : 'فاتورة جديدة';
    logAct(wasEditing?'تعديل فاتورة':'إنشاء فاتورة', k, '#'+(rows[0].no||id)+' — '+partyName+' — '+items+' — الإجمالي '+money(total)+' — تكلفة محفوظة '+money(cost)+' — '+beforeText);
    store();
  };
  const _del230 = del;
  del = function(k,id){
    if (!ST[k]) return _del230(k,id);
    const before = db[k].filter(r=>(r.inv||r.id)==id);
    if (!before.length) return _del230(k,id);
    const snap = before.map(r=>({product:r.product,qty:r.qty,total:r.total,cost:r.cost}));
    _del230(k,id);
    const remains = db[k].some(r=>(r.inv||r.id)==id);
    if (!remains) {
      const partyName = nameOf(k==='sales'?'customers':'suppliers',before[0].party);
      const total = snap.reduce((a,r)=>a+(+r.total||0),0);
      const cost = snap.reduce((a,r)=>a+(+r.qty||0)*(+r.cost||0),0);
      logAct('حذف فاتورة',k,'#'+(before[0].no||id)+' — '+partyName+' — إجمالي '+money(total)+' — تكلفة '+money(cost)+' — '+snap.map(r=>nameOf('products',r.product)+' × '+r.qty).join('، '));
      store();
    }
  };
})();
</script>
